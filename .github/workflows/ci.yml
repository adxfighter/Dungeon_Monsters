name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      - name: Zod stays out of the production bundle
        # Content schemas are for dev validation and tests only (DECISIONS_LOG 2026-09-29).
        run: |
          if grep -l 'ZodError' dist/assets/*.js; then
            echo '::error::Zod leaked into the production bundle (a runtime import of @content/schemas?)'
            exit 1
          fi

      - name: Report bundle size (gzip)
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            echo "- \`$(basename "$f")\`: $(gzip -c "$f" | wc -c) bytes gzip" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
